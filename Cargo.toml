[package]
name = "spin_clash"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
avian3d = { version = "0.6.1", default-features = false, features = ["3d", "parry-f32", "parallel"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Fast iterative builds: optimize dependencies, keep our crate quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
